# ============================================================
# El Papelillo - TFG - Configuración del Entorno
# Universidad de Málaga (UMA) - 2026
# ============================================================

# --- Servidor ---
server.port=8080
server.servlet.context-path=/

# --- Base de datos MySQL 8 ---
spring.datasource.url=jdbc:mysql://localhost:3306/elpapelillo?useSSL=false&serverTimezone=Europe/Madrid&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.pool-name=ElPapelilloPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid
spring.jpa.open-in-view=false

# --- Logging ---
logging.level.es.uma.ajdp.tfg.elpapelillo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/elpapelillo.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- Mensajes de validación ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Jackson (serialización JSON) ---
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Madrid
