<div class="confetti-container">
  @for (c of confettis; track $index) {
    <div class="confetti" [ngStyle]="c.style"></div>
  }
</div>

<header class="main-header">
  <h1 (click)="redirigirAlPanel()">ElPapelillo</h1>

  @if (!esRutaAcceso) {
    <div class="user-profile">
      <div class="user-info" (click)="toggleMenu()">
        <span class="user-name">Usuario</span>
        <div class="user-avatar">
          <i class="fas fa-user-circle"></i>
        </div>
      </div>

      @if (menuAbierto) {
        <div class="dropdown-menu">
          <a (click)="irAEditar()" style="cursor: pointer;">
            <i class="fas fa-user-edit"></i> Mi Perfil
          </a>
          
          <hr> <a (click)="logout()" style="cursor: pointer;" class="logout-link">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
          </a>
        </div>
      }
    </div>
  }
</header>

<router-outlet></router-outlet>
