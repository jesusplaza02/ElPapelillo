<div class="content">
  <div class="register-card">
    <h2>Registro de Usuario</h2>
    <p class="subtitle">Ingresa los datos del sistema</p>

    <div class="form-grid">
      <div class="input-group">
        <label>Nombre</label>
        <input type="text" placeholder="Tu nombre">
      </div>
      <div class="input-group">
        <label>Apellidos</label>
        <input type="text" placeholder="Tus apellidos">
      </div>

      <div class="input-group">
        <label>DNI</label>
        <input type="text" placeholder="12345678A">
      </div>
      <div class="input-group">
        <label>Teléfono</label>
        <input type="tel" placeholder="600 000 000">
      </div>

      <div class="input-group">
        <label>Teléfono de emergencia</label>
        <input type="tel" placeholder="650 500 500">
      </div>

      <div class="input-group full-width">
        <label>Correo Electrónico</label>
        <input type="email" placeholder="ejemplo@correo.com">
      </div>
      
    </div>

    <div class="btn-container">
      <button class="btn-submit">Finalizar Registro</button>
      <a class="back-link" routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
  </div>
</div>
