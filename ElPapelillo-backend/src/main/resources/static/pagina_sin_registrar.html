<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElPapelillo - Inicio</title>
    <style>
        /* 1. Estilos Generales */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Evita scroll por el confeti */
        }

        /* 2. Contenedor Principal (Fondo Rosa) */
        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #FCE4EC; /* Rosa pálido de la imagen */
            position: relative;
        }

        /* 3. Barra Superior (Azul) */
        header {
            background-color: #90CAF9; /* Azul claro */
            padding: 15px 30px;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #1A237E; /* Azul oscuro para el texto */
            font-weight: bold;
        }

        /* 4. Área de Contenido y Botones */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5; /* Por encima del confeti */
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Estilo base de los botones */
        .btn {
            padding: 12px 40px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 250px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        /* Botón Iniciar Sesión (Azul) */
        .btn-login {
            background-color: #90CAF9;
            color: #0D47A1;
        }

        /* Botón Registrar (Verde) */
        .btn-register {
            background-color: #80F2B0;
            color: #1B5E20;
        }

        /* 5. Estilos del Confeti (Fondo) */
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Para que no interfiera con los clicks */
        }

        .confetti {
            position: absolute;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>ElPapelillo</h1>
        </header>

        <div class="confetti-container" id="confetti-bg"></div>

        <div class="content">
            <div class="button-group">
                <button class="btn btn-login" onclick="window.location.href='pagina_iniciar_sesion.html'">Iniciar sesión</button>
                <button class="btn btn-register" onclick="window.location.href='pagina_registro.html'">Registrar Representante</button>
            </div>
        </div>
    </div>

    <script>
        // Script para generar los papelillos aleatorios
        const container = document.getElementById('confetti-bg');
        const colors = ['#FF5252', '#FF4081', '#7C4DFF', '#448AFF', '#69F0AE', '#FFD740', '#FFAB40'];
        const shapes = ['rect', 'circle', 'line'];

        for (let i = 0; i < 60; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            
            // Posición aleatoria
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = Math.random() * 100 + 'vh';
            
            // Color aleatorio
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Forma aleatoria
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            const size = Math.random() * 10 + 5;

            if (shape === 'rect') {
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
            } else if (shape === 'circle') {
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                confetti.style.borderRadius = '50%';
            } else {
                confetti.style.width = (size * 3) + 'px';
                confetti.style.height = '3px';
            }

            // Rotación aleatoria
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

            container.appendChild(confetti);
        }
    </script>
</body>
</html>
