<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElPapelillo - Login</title>
    <style>
        /* 1. Estilos Base */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%; /* Cambiado para permitir scroll si es necesario */
            font-family: 'Segoe UI', sans-serif;
            background-color: #FCE4EC;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        header {
            background-color: #C6DFFF;
            padding: 15px 30px;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: #2C3E50;
        }

        /* 2. El Formulario (Ajustado para iPhone/Móvil) */
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Margen externo para que no toque los bordes del móvil */
            z-index: 5;
        }

        .login-card {
            background-color: white;
            padding: 40px; /* Relleno para PC */
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 90%; /* Ocupa el 90% del ancho en móviles */
            max-width: 400px; /* Un pelín más estrecha para que se vea más estilizada */
            text-align: center;
            box-sizing: border-box;
        }

        /* MEDIA QUERY: Ajustes específicos para móviles (iPhone) */
        @media (max-width: 480px) {
            .login-card {
                padding: 25px; /* Reducimos el relleno interno en el móvil */
            }
            .login-card h2 {
                font-size: 26px; /* Título un poco más pequeño */
            }
        }

        .login-card h2 {
            font-size: 32px;
            margin: 0 0 5px 0;
            color: #1A237E;
        }

        .login-card p {
            color: #757575;
            margin-bottom: 30px;
        }

        /* 3. Inputs y Labels */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #FAFAFA;
        }

        /* 4. Botones */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-login {
            background-color: #C6DFFF;
            color: #1A237E;
        }

        .btn-register {
            background-color: #B9F6CA;
            color: #1B5E20;
        }

        .forgot-password {
            color: #546E7A;
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin-top: 10px;
        }

        /* 5. Confeti de fondo */
        .confetti-container {
            position: fixed; /* Fixed para que no se mueva al hacer scroll */
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>ElPapelillo</h1>
        </header>

        <div class="confetti-container" id="confetti-bg"></div>

        <div class="content">
            <div class="login-card">
                <h2>Bienvenido</h2>
                <p>Inicia sesión en tu cuenta</p>

                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" placeholder="Ingresa tu usuario">
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Ingresa tu contraseña">
                </div>

                <button class="btn btn-login">Iniciar Sesión</button>
                <button class="btn btn-register" onclick="window.location.href='pagina_registro.html'">Registrarse</button>

                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('confetti-bg');
        const colors = ['#FFCDD2', '#F8BBD0', '#E1BEE7', '#D1C4E9', '#C5CAE9', '#B3E5FC', '#C8E6C9', '#FFF9C4'];
        
        for (let i = 0; i < 35; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = Math.random() * 100 + 'vh';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
            container.appendChild(confetti);
        }
    </script>
</body>
</html>
